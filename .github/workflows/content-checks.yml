name: Content and unit checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Question manifest is current
        run: |
          npm run prebuild
          if ! git diff --quiet public/question-manifest.json; then
            echo "public/question-manifest.json is stale."
            echo "Run 'npm run prebuild' and commit the result."
            git diff public/question-manifest.json
            exit 1
          fi

      - name: No private paths are tracked
        run: npm run check-private-paths

      # Reported, not enforced: the Astro 4 toolchain carries known advisories
      # that need a major upgrade, which is deferred to a separate change.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Snapshot content checks
        run: npm run content-check

      - name: Unit tests
        run: npm test

      # Scoped to the Snapshot only. The rest of the site carries 59
      # pre-existing type errors in TakeoverMenu, FilmPlayer and
      # ConsentBanner, so `astro check` cannot be blocking until those
      # are cleared. Reported, not enforced.
      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run typecheck

      # A merge to main publishes. Build on the PR so a broken page is
      # caught before it can reach the deploy workflow.
      - name: Build
        run: npm run build
