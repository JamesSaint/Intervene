name: Content and unit checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authorship policy
        env:
          AUTHORSHIP_BASE: ${{ github.event.pull_request.base.sha }}
          AUTHORSHIP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check-authorship

      # Lifecycle scripts are skipped: nothing in the build needs them, and
      # they are the usual way a compromised dependency runs code in CI.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Question manifest is current
        run: |
          npm run prebuild
          if ! git diff --quiet public/question-manifest.json; then
            echo "public/question-manifest.json is stale."
            echo "Run 'npm run prebuild' and commit the result."
            git diff public/question-manifest.json
            exit 1
          fi

      - name: No private paths are tracked
        run: npm run check-private-paths

      # Report dependency advisories alongside the build checks.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Snapshot content checks
        run: npm run content-check

      # Text fills its layout: no unjustified width caps, balanced wraps or
      # manual line breaks. See docs/design-standards.md.
      - name: Text flow and content width
        run: npm run check-text-flow

      - name: Unit tests
        run: npm test

      # Report type diagnostics alongside the content and build checks.
      - name: Typecheck
        run: npm run typecheck

      # A merge to main publishes. Build on the PR so a broken page is
      # caught before it can reach the deploy workflow.
      - name: Build
        run: npm run build
