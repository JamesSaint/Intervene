name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The deploy job alone is granted what it needs to
# publish: the build job runs npm install scripts and build code, so it must
# not hold a token that can mint a Pages deployment.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      # Lifecycle scripts are skipped: nothing in the build needs them, and
      # they are the usual way a compromised dependency runs code in CI.
      - name: Install
        run: npm ci --ignore-scripts

      - name: No private paths are tracked
        run: npm run check-private-paths

      - name: Snapshot content checks
        run: npm run content-check

      - name: Unit tests
        run: npm test

      # `npm run build` runs `prebuild` first, which regenerates
      # public/question-manifest.json from the question set.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
          # The artifact action drops dotfiles by default, which would omit
          # /.well-known/security.txt. .git and .github are always excluded.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
