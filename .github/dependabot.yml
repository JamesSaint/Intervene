version: 2
updates:
  # Keeps the SHA-pinned actions current; each update arrives as a reviewable pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  # Routine npm updates, batched so they do not arrive one package at a time.
  # Security updates are separate and arrive immediately (repository setting).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
